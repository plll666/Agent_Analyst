[project]
name = "agent-analyst-backend"
version = "0.1.0"
description = "Agent Analyst — трек agent analyst. FastAPI: HTTP-слой, оркестрация, адаптеры."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "arq>=0.26.0",
    "redis>=5.2.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "httpx>=0.27.0",
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "testcontainers[postgres]>=4.9.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "ASYNC",
    "C4",
    "RET",
    "ARG",
    "D",
]
ignore = [
    "D100",
    "D101",
    "D102",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"alembic/script.py.mako" = ["D", "E501"]
"tests/*" = ["D103"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
markers = [
    "integration: поднимает внешние зависимости (testcontainers, брокер)",
    "agent: сквозной цикл Natural language -> объяснение",
]